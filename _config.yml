# Hexo Configuration
# Docs: https://hexo.io/docs/configuration.html

# Site
title: Hanerson 的学术车辙
subtitle: '观察 · 描述 · 记录'
description: '算法、系统与阅读留下的车辙。'
keywords:
  - 算法
  - 操作系统
  - 编译原理
  - CUDA
  - 读书笔记
author: Hanerson
language: zh-CN
timezone: 'Asia/Shanghai'

# URL
# `:name` 只取文件名，文章的目录层级不会进入地址。
url: https://blog.hanerson.top
permalink: ':year/:month/:day/:name/'
permalink_defaults:
pretty_urls:
  trailing_index: false
  trailing_html: false

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: ':lang'
skip_render:

# Writing
new_post_name: ':title.md'
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false

# Home page setting
index_generator:
  path: ''
  per_page: 10
  order_by: '-date'

# Category & Tag
default_category: 未分类
category_map:
tag_map:

# Metadata
meta_generator: true

# Date / Time format
date_format: YYYY-MM-DD
time_format: HH:mm:ss
# 不在每次编辑时改写“更新时间”，需要时请在 Front Matter 里写 `updated`。
updated_option: 'date'

# Pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
include:
exclude:
ignore:

# Archives
archive_generator:
  enabled: true
  per_page: 0
  yearly: false
  monthly: false
  daily: false

# Extensions
theme: stellar

# Deployment
# Docs: https://hexo.io/docs/one-command-deployment
deploy:
  type: ''
